[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flash-dtof-simulator"
version = "0.3.0"
description = "Full-array first-photon Flash dToF simulator with equi-width histograms"
readme = "README.md"
requires-python = ">=3.8"
authors = [{name = "Flash dToF simulator contributors"}]
dependencies = [
  "numpy>=1.24,<2",
  "Pillow>=10,<11",
]

[tool.setuptools.packages.find]
include = ["flash_dtof*"]
